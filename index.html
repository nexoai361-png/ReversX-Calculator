<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  font-family: 'Lato', sans-serif;
  background: #1e1e1e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}

.calculator {
  width: 100%;
  max-width: 420px;
  background: #2d2d2d;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  border: 1px solid #3d3d3d;
}

.display {
  background: #1e1e1e;
  padding: 24px 20px 16px;
  min-height: 140px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;
  border-bottom: 1px solid #3d3d3d;
}

.history {
  color: #888;
  font-size: 16px;
  font-weight: 400;
  min-height: 24px;
  text-align: right;
  width: 100%;
  overflow-x: auto;
  white-space: nowrap;
  margin-bottom: 4px;
}

.expression {
  color: #aaa;
  font-size: 18px;
  font-weight: 400;
  min-height: 28px;
  text-align: right;
  width: 100%;
  overflow-x: auto;
  white-space: nowrap;
  margin-bottom: 8px;
}

.result {
  color: #fff;
  font-size: 42px;
  font-weight: 300;
  text-align: right;
  width: 100%;
  overflow-x: auto;
  white-space: nowrap;
  letter-spacing: -1px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 8px;
  gap: 6px;
}

.btn {
  border: none;
  border-radius: 12px;
  font-size: 22px;
  font-weight: 400;
  font-family: 'Lato', sans-serif;
  padding: 18px 0;
  cursor: pointer;
  transition: all 0.1s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.btn:active {
  transform: scale(0.95);
}

.btn-number {
  background: #3d3d3d;
  color: #ffffff;
}

.btn-number:active {
  background: #555;
}

.btn-operator {
  background: #383838;
  color: #4fc3f7;
  font-size: 24px;
}

.btn-operator:active {
  background: #4a4a4a;
}

.btn-equals {
  background: #4fc3f7;
  color: #1e1e1e;
  font-size: 26px;
  font-weight: 700;
}

.btn-equals:active {
  background: #81d4fa;
}

.btn-function {
  background: #333333;
  color: #ffffff;
  font-size: 18px;
}

.btn-function:active {
  background: #444;
}

.btn-clear {
  background: #333333;
  color: #ef5350;
  font-size: 18px;
}

.btn-clear:active {
  background: #444;
}

.btn-zero {
  grid-column: span 2;
}

.mode-toggle {
  display: flex;
  padding: 8px 12px;
  gap: 4px;
  background: #252525;
  border-bottom: 1px solid #3d3d3d;
}

.mode-btn {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: #888;
  font-size: 13px;
  font-family: 'Lato', sans-serif;
  font-weight: 400;
  cursor: pointer;
  transition: all 0.2s;
}

.mode-btn.active {
  background: #3d3d3d;
  color: #4fc3f7;
}

.scientific {
  display: none;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  padding: 0 8px 8px;
}

.scientific.active {
  display: grid;
}

.scientific .btn {
  font-size: 15px;
  padding: 12px 0;
}

.memory-bar {
  display: flex;
  gap: 4px;
  padding: 4px 12px;
  background: #252525;
}

.memory-btn {
  padding: 4px 10px;
  border: none;
  border-radius: 6px;
  background: #333;
  color: #aaa;
  font-size: 11px;
  font-family: 'Lato', sans-serif;
  font-weight: 400;
  cursor: pointer;
  transition: all 0.2s;
}

.memory-btn:active {
  background: #444;
  color: #4fc3f7;
}

@media (max-width: 400px) {
  .calculator {
    border-radius: 0;
    max-width: 100%;
    min-height: 100vh;
  }
  .result {
    font-size: 36px;
  }
  .btn {
    font-size: 20px;
    padding: 16px 0;
  }
}
</style>
</head>
<body>

<div class="calculator">
  <div class="mode-toggle">
    <button class="mode-btn active" onclick="setMode('standard')">Standard</button>
    <button class="mode-btn" onclick="setMode('scientific')">Scientific</button>
  </div>

  <div class="memory-bar">
    <button class="memory-btn" onclick="memoryClear()">MC</button>
    <button class="memory-btn" onclick="memoryRecall()">MR</button>
    <button class="memory-btn" onclick="memoryAdd()">M+</button>
    <button class="memory-btn" onclick="memorySubtract()">M-</button>
    <button class="memory-btn" onclick="memoryStore()">MS</button>
  </div>

  <div class="display">
    <div class="history" id="history"></div>
    <div class="expression" id="expression">&nbsp;</div>
    <div class="result" id="result">0</div>
  </div>

  <div class="scientific" id="scientific">
    <button class="btn btn-function" onclick="appendFunction('sin')">sin</button>
    <button class="btn btn-function" onclick="appendFunction('cos')">cos</button>
    <button class="btn btn-function" onclick="appendFunction('tan')">tan</button>
    <button class="btn btn-function" onclick="appendFunction('log')">log</button>
    <button class="btn btn-function" onclick="appendFunction('ln')">ln</button>
    <button class="btn btn-function" onclick="appendFunction('sqrt')">&radic;</button>
    <button class="btn btn-function" onclick="appendFunction('cbrt')">&#8731;</button>
    <button class="btn btn-function" onclick="square()">x&sup2;</button>
    <button class="btn btn-function" onclick="cube()">x&sup3;</button>
    <button class="btn btn-function" onclick="power()">x<sup>y</sup></button>
    <button class="btn btn-function" onclick="appendValue('Math.PI')">&pi;</button>
    <button class="btn btn-function" onclick="appendValue('Math.E')">e</button>
    <button class="btn btn-function" onclick="factorial()">n!</button>
    <button class="btn btn-function" onclick="appendFunction('abs')">|x|</button>
    <button class="btn btn-function" onclick="inverse()">1/x</button>
  </div>

  <div class="buttons">
    <button class="btn btn-clear" onclick="clearAll()">AC</button>
    <button class="btn btn-function" onclick="toggleSign()">&plusmn;</button>
    <button class="btn btn-function" onclick="percentage()">%</button>
    <button class="btn btn-operator" onclick="appendOperator('/')">&divide;</button>

    <button class="btn btn-number" onclick="appendNumber('7')">7</button>
    <button class="btn btn-number" onclick="appendNumber('8')">8</button>
    <button class="btn btn-number" onclick="appendNumber('9')">9</button>
    <button class="btn btn-operator" onclick="appendOperator('*')">&times;</button>

    <button class="btn btn-number" onclick="appendNumber('4')">4</button>
    <button class="btn btn-number" onclick="appendNumber('5')">5</button>
    <button class="btn btn-number" onclick="appendNumber('6')">6</button>
    <button class="btn btn-operator" onclick="appendOperator('-')">-</button>

    <button class="btn btn-number" onclick="appendNumber('1')">1</button>
    <button class="btn btn-number" onclick="appendNumber('2')">2</button>
    <button class="btn btn-number" onclick="appendNumber('3')">3</button>
    <button class="btn btn-operator" onclick="appendOperator('+')">+</button>

    <button class="btn btn-number btn-zero" onclick="appendNumber('0')">0</button>
    <button class="btn btn-number" onclick="appendDecimal()">.</button>
    <button class="btn btn-equals" onclick="calculate()">=</button>
  </div>
</div>

<script>
let currentInput = '0';
let previousInput = '';
let operator = null;
let shouldResetScreen = false;
let memory = 0;
let history = '';

const resultEl = document.getElementById('result');
const expressionEl = document.getElementById('expression');
const historyEl = document.getElementById('history');
const scientificEl = document.getElementById('scientific');

function updateDisplay() {
  resultEl.textContent = formatDisplay(currentInput);
  expressionEl.innerHTML = history || '&nbsp;';
}

function formatDisplay(num) {
  if (num === 'Error' || num === 'Infinity' || num === '-Infinity' || num === 'NaN') return 'Error';
  const n = parseFloat(num);
  if (isNaN(n)) return num;
  if (Number.isInteger(n) && Math.abs(n) < 1e15) {
    return n.toLocaleString('en-US');
  }
  if (num.includes('.')) {
    const parts = num.split('.');
    const intPart = parseInt(parts[0].replace('-', '')) || 0;
    const sign = parts[0].startsWith('-') ? '-' : '';
    return sign + intPart.toLocaleString('en-US') + '.' + parts[1];
  }
  return n.toLocaleString('en-US');
}

function getRaw(numStr) {
  return numStr.replace(/,/g, '');
}

function appendNumber(num) {
  if (currentInput === 'Error') clearAll();
  if (shouldResetScreen) {
    currentInput = num;
    shouldResetScreen = false;
  } else {
    const raw = getRaw(currentInput);
    if (raw.replace(/[^0-9]/g, '').length >= 15) return;
    if (currentInput === '0') {
      currentInput = num;
    } else {
      currentInput = currentInput + num;
    }
  }
  updateDisplay();
}

function appendDecimal() {
  if (shouldResetScreen) {
    currentInput = '0.';
    shouldResetScreen = false;
    updateDisplay();
    return;
  }
  if (!currentInput.includes('.')) {
    currentInput = currentInput + '.';
  }
  updateDisplay();
}

function appendOperator(op) {
  if (currentInput === 'Error') return;
  if (operator !== null && !shouldResetScreen) {
    compute();
  }
  previousInput = getRaw(currentInput);
  operator = op;
  history = formatDisplay(currentInput) + ' ' + getOpSymbol(op);
  shouldResetScreen = true;
  updateDisplay();
}

function getOpSymbol(op) {
  switch(op) {
    case '*': return '&times;';
    case '/': return '&divide;';
    case '+': return '+';
    case '-': return '-';
    case '^': return '^';
    default: return op;
  }
}

function compute() {
  if (operator === null) return;
  let result;
  const prev = parseFloat(previousInput);
  const curr = parseFloat(getRaw(currentInput));

  if (isNaN(prev) || isNaN(curr)) return;

  switch(operator) {
    case '+': result = prev + curr; break;
    case '-': result = prev - curr; break;
    case '*': result = prev * curr; break;
    case '/':
      if (curr === 0) { currentInput = 'Error'; operator = null; history = ''; updateDisplay(); return; }
      result = prev / curr;
      break;
    case '^': result = Math.pow(prev, curr); break;
    default: return;
  }

  history = formatDisplay(previousInput) + ' ' + getOpSymbol(operator) + ' ' + formatDisplay(currentInput) + ' =';
  currentInput = parseFloat(result.toPrecision(12)).toString();
  operator = null;
  previousInput = '';
  shouldResetScreen = true;
  updateDisplay();
}

function calculate() {
  if (operator === null) return;
  compute();
}

function clearAll() {
  currentInput = '0';
  previousInput = '';
  operator = null;
  history = '';
  shouldResetScreen = false;
  updateDisplay();
}

function toggleSign() {
  if (currentInput === '0' || currentInput === 'Error') return;
  if (currentInput.startsWith('-')) {
    currentInput = currentInput.substring(1);
  } else {
    currentInput = '-' + currentInput;
  }
  updateDisplay();
}

function percentage() {
  if (currentInput === 'Error') return;
  const val = parseFloat(getRaw(currentInput));
  currentInput = (val / 100).toString();
  updateDisplay();
}

function appendFunction(func) {
  if (currentInput === 'Error') return;
  const num = parseFloat(getRaw(currentInput));
  let result;
  switch(func) {
    case 'sin': result = Math.sin(num * Math.PI / 180); break;
    case 'cos': result = Math.cos(num * Math.PI / 180); break;
    case 'tan': result = Math.tan(num * Math.PI / 180); break;
    case 'log': result = Math.log10(num); break;
    case 'ln': result = Math.log(num); break;
    case 'sqrt': result = Math.sqrt(num); break;
    case 'cbrt': result = Math.cbrt(num); break;
    case 'abs': result = Math.abs(num); break;
  }
  if (isNaN(result) || !isFinite(result)) { currentInput = 'Error'; updateDisplay(); return; }
  history = func + '(' + currentInput + ')';
  currentInput = parseFloat(result.toPrecision(12)).toString();
  shouldResetScreen = true;
  updateDisplay();
}

function square() {
  if (currentInput === 'Error') return;
  const num = parseFloat(getRaw(currentInput));
  history = formatDisplay(currentInput) + '²';
  currentInput = parseFloat((num * num).toPrecision(12)).toString();
  shouldResetScreen = true;
  updateDisplay();
}

function cube() {
  if (currentInput === 'Error') return;
  const num = parseFloat(getRaw(currentInput));
  history = formatDisplay(currentInput) + '³';
  currentInput = parseFloat((num * num * num).toPrecision(12)).toString();
  shouldResetScreen = true;
  updateDisplay();
}

function power() {
  previousInput = getRaw(currentInput);
  operator = '^';
  history = formatDisplay(previousInput) + '^';
  shouldResetScreen = true;
  updateDisplay();
}

function factorial() {
  if (currentInput === 'Error') return;
  const num = parseInt(getRaw(currentInput));
  if (num < 0 || num > 170) { currentInput = 'Error'; updateDisplay(); return; }
  let result = 1;
  for (let i = 2; i <= num; i++) result *= i;
  history = currentInput + '!';
  currentInput = result.toString();
  shouldResetScreen = true;
  updateDisplay();
}

function inverse() {
  if (currentInput === 'Error') return;
  const num = parseFloat(getRaw(currentInput));
  if (num === 0) { currentInput = 'Error'; updateDisplay(); return; }
  history = '1/(' + currentInput + ')';
  currentInput = parseFloat((1 / num).toPrecision(12)).toString();
  shouldResetScreen = true;
  updateDisplay();
}

function appendValue(val) {
  if (val === 'Math.PI') {
    currentInput = Math.PI.toString();
  } else if (val === 'Math.E') {
    currentInput = Math.E.toString();
  }
  shouldResetScreen = true;
  updateDisplay();
}

function setMode(mode) {
  const btns = document.querySelectorAll('.mode-btn');
  if (mode === 'scientific') {
    scientificEl.classList.add('active');
    btns[1].classList.add('active');
    btns[0].classList.remove('active');
  } else {
    scientificEl.classList.remove('active');
    btns[0].classList.add('active');
    btns[1].classList.remove('active');
  }
}

function memoryClear() { memory = 0; }
function memoryRecall() { currentInput = memory.toString(); shouldResetScreen = true; updateDisplay(); }
function memoryAdd() { memory += parseFloat(getRaw(currentInput)) || 0; }
function memorySubtract() { memory -= parseFloat(getRaw(currentInput)) || 0; }
function memoryStore() { memory = parseFloat(getRaw(currentInput)) || 0; }

document.addEventListener('keydown', (e) => {
  if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
  else if (e.key === '.') appendDecimal();
  else if (e.key === '+') appendOperator('+');
  else if (e.key === '-') appendOperator('-');
  else if (e.key === '*') appendOperator('*');
  else if (e.key === '/') { e.preventDefault(); appendOperator('/'); }
  else if (e.key === 'Enter' || e.key === '=') calculate();
  else if (e.key === 'Escape') clearAll();
  else if (e.key === 'Backspace') {
    if (shouldResetScreen) { clearAll(); return; }
    const raw = getRaw(currentInput);
    if (raw.length > 1) {
      const newRaw = raw.slice(0, -1);
      currentInput = newRaw === '-' || newRaw === '' ? '0' : newRaw;
    } else {
      currentInput = '0';
    }
    updateDisplay();
  }
});

updateDisplay();
</script>
</body>
</html>
